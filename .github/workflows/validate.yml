name: Dialogue Archive v0.1 Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Dialogue Records
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema[format]"

      - name: Validate Dialogue Archive records
        run: |
          python scripts/validate.py

      - name: Validation completed
        if: success()
        run: |
          echo "Dialogue Archive v0.1 validation passed."
